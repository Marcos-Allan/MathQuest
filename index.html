<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css" media="screen and (orientation: portrait)">
    <link rel="stylesheet" href="css/landscape.css" media="screen and (orientation: landscape)">
    <script src="js/main.js" defer></script>
    <title>MathQuest</title>

    <meta property="og:title" content="MathQuest" />
    <meta property="og:description" content="Minigame de teste de conhecimento em matemática simples" />
    <meta property="og:image" content="https://marcos-allan.github.io/MathQuest/imgs/icon.png" />
    <meta property="og:url" content="https://marcos-allan.github.io/MathQuest" />
    <meta property="og:type" content="website" />

    <meta name="description" content="Minigame de estudos de questões de matemática" />

    <meta property="og:site_name" content="MathQuest" />
    <meta property="article:author" content="Marcos Allan" />

</head>
<body>
    <main>
        <h1>MATH QUEST</h1>
        <section class="mostrar">
            <p class="plc">placar: <span class="pontos">0</span></p>
            <p class="timerText"><span class="timer">0</span></p>
        </section>

        <section class="telas">
            <section id="questions">
                <p id="question"></p>
                <p>= ?</p>
            </section>
            <section id="answers">
            
            </section>
        </section>

        <section id="points">
            <form id="form">
                <input type="text" id="name" class="inp" />
                <div class="inp">
                    <input type="password" id="password" />
                    <i class="fa-solid fa-eye-slash"></i>
                    <i class="fa-solid fa-eye"></i>
                </div>
                <input type="submit" value="enviar">
            </form>
            <section id="congratulations">
                <p class="text-rainbow">Aqui estão seus pontos <br/> <span class="juju">minha Labubu</span> <br/>  <span class="emoji">😉</span> </p>
            </section>
        </section>
    </main>
</body>
</html>
